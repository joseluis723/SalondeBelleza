# Archivo de infraestructura para Render (Blueprint).
# Al conectar este repositorio en Render y elegir "New +" > "Blueprint",
# Render creará automáticamente el Web Service con un Disco persistente
# donde vive el archivo SQLite (salon.db).
#
# IMPORTANTE #1: los Discos persistentes de Render NO están disponibles en el
# plan "Free" de un Web Service; se necesita al menos el plan "Starter".
# Si usas "Free", el archivo SQLite se borrará cada vez que el servicio
# se reinicie o se re-despliegue.
#
# IMPORTANTE #2: el disco persistente solo está disponible en RUNTIME, no
# durante el "build" (Render usa una máquina aparte para compilar). Por eso
# las migraciones NO van en buildCommand: van al inicio de startCommand,
# que sí corre ya con el disco montado.

services:
  - type: web
    name: salon-app
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    disk:
      name: salon-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: /var/data/salon.db
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
